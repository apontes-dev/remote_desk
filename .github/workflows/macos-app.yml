name: macOS app

on:
  push:
    paths:
      - "macos-app/**"
      - ".github/workflows/macos-app.yml"
  pull_request:
    paths:
      - "macos-app/**"
      - ".github/workflows/macos-app.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swiftc --version

      - name: Build universal app
        run: ./macos-app/build.sh

      - name: Zip app
        run: |
          cd macos-app/build
          ditto -c -k --sequesterRsrc --keepParent "Remote Desktop Host.app" RemoteDesktopHost-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: RemoteDesktopHost-macOS
          path: macos-app/build/RemoteDesktopHost-macOS.zip
